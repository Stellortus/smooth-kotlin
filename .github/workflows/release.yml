name: Build and release

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Gradle Wrapper executable permission
        run: chmod +x gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify Gradle Wrapper is executable
        run: |
          test -x gradlew
          ./gradlew --version
      - name: Test release automation
        run: node --test .github/scripts/release.test.mjs
      - name: Read project version
        id: version
        run: |
          version=$(./gradlew --no-daemon --console=plain -q printVersion)
          VERSION="$version" node --input-type=module -e '
            import { validateVersion } from "./.github/scripts/release.mjs";
            validateVersion(process.env.VERSION);
          '
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and verify Maven publication
        run: ./gradlew --no-daemon --console=plain build publishToMavenLocal -Dmaven.repo.local="$PWD/build/verification-repository"
      - name: Save release artifacts
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v7
        with:
          name: release-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-jars
          path: build/libs
      - name: Create release and build on JitPack
        run: node .github/scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
